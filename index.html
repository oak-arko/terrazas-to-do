<style>
:root{--ink:#243e34;--muted:#62685f;--paper:#f4f2eb;--line:#d9ddd3;--gold:#e7bd79;--white:#fffef9;--red:#9b3d31}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button,a,select{cursor:pointer}button{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:10px 15px;background:var(--white);color:var(--ink);transition:background .15s}button:hover{background:#e6ebdf}button.primary{background:var(--ink);color:white;border-color:var(--ink)}button.primary:hover{background:#385747}button.danger{color:var(--red)}:focus-visible{outline:3px solid #b77b27;outline-offset:3px}input,select,textarea{min-height:44px;padding:10px;border:1px solid #a7afa2;border-radius:7px;background:white;color:var(--ink);max-width:100%}textarea{width:100%;min-height:90px}label{display:grid;gap:6px;font-weight:600}h1,h2,h3,p{margin-top:0}h1,h2{font-family:Georgia,serif;font-weight:400;line-height:1.12}h1{font-size:clamp(32px,4vw,50px);margin-bottom:14px}h2{font-size:29px}h3{font-size:17px;margin-bottom:9px}small,.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.sidebar{background:var(--ink);color:#fffef9;padding:32px 22px;display:flex;flex-direction:column;gap:28px}.brand{font:27px Georgia,serif;letter-spacing:4px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700}.sidebar .eyebrow{color:#d5ddcf;margin-top:8px}nav{display:grid;gap:7px}nav button{background:transparent;border-color:transparent;color:#e1e8de;text-align:left;display:flex;gap:14px;align-items:center}nav button[aria-current=page],nav button:hover{background:#3b5549;color:white}nav span{font-size:12px;color:#b8cdbb}.sidebar footer{margin-top:auto;font-size:12px;color:#d5ddcf;border-top:1px solid #617368;padding-top:20px}.sidebar footer b{display:block;color:var(--gold);font-size:16px;margin-top:5px}.workspace{min-width:0}.topbar{padding:20px 38px;display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid var(--line);background:#fffef980}.identity{display:flex;align-items:center;gap:10px}.identity label{font-size:12px}.identity select{max-width:190px}.save{font-size:12px}.main{max-width:1400px;padding:34px 38px 50px;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}.heading p{margin:8px 0 0}.hero{background:var(--ink);color:white;border-radius:14px;padding:34px;display:grid;grid-template-columns:1fr auto;gap:30px;margin-bottom:24px;position:relative;overflow:hidden}.hero .eyebrow{color:var(--gold);margin-bottom:15px}.hero p{color:#d8e3d8;max-width:620px;margin-bottom:0}.count{border-left:1px solid #718477;padding-left:35px;min-width:180px;align-self:center}.count strong{font:68px Georgia,serif;display:block;color:var(--gold)}.count span{font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px}.stat,.card{border:1px solid var(--line);background:var(--white);border-radius:11px;padding:22px}.stat strong{display:block;font:34px Georgia,serif;margin:7px 0}.stat span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{display:flex;flex-direction:column;gap:9px}.card p{color:var(--muted);font-size:14px;margin:0 0 10px}.card .bottom{margin-top:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.section-title{margin:28px 0 16px}.section-title h2{margin:0}.badge{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:4px 10px;font-size:12px;background:#f1f3ec;white-space:nowrap}.badge.red{background:#fbece5;color:#8b3028;border-color:#eac3b8}.progress{height:6px;border-radius:8px;background:#e5e8de;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:#708768}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:end}.filters label{font-size:12px}.filters .search{flex:1;min-width:180px}.task{border:1px solid var(--line);background:var(--white);padding:18px 20px;border-radius:10px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}.task .tick{padding:0;width:44px;font-size:22px}.task h3{margin:0 0 7px}.task .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}.task.done h3{text-decoration:line-through;color:var(--muted)}.notice{background:#e9eee4;border:1px solid #cad6c1;padding:14px 18px;border-radius:9px;font-size:13px;margin-top:28px}.empty{padding:35px;text-align:center;background:var(--white);border:1px dashed #a5b39f;border-radius:10px}.timeline{display:grid;gap:16px}.stage{display:grid;grid-template-columns:60px 1fr auto;gap:20px;align-items:center}.stage .number{font:32px Georgia,serif;color:#6d8065}.stage h3{margin:0}.stage p{margin:6px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.person{display:flex;gap:15px;align-items:center}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#e5eadc;font-weight:700}.page-note{max-width:760px}.help{line-height:1.8}.help h3{margin-top:24px}dialog{border:1px solid var(--line);border-radius:14px;width:600px;max-width:calc(100% - 24px);max-height:90vh;padding:26px;background:var(--white);color:var(--ink)}dialog::backdrop{background:#13281db3}dialog h2{margin-bottom:0}form{display:grid;gap:16px;margin-top:20px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}fieldset{border:1px solid var(--line);border-radius:8px;padding:12px}legend{font-weight:600}.checks{display:flex;gap:8px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:7px 12px;border-radius:7px;font-size:14px}.checks input{min-height:24px;width:20px;height:20px;accent-color:var(--ink)}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:9px;background:#243e34;color:white;z-index:10;box-shadow:0 5px 25px #0003;max-width:90vw}.toast:empty{display:none}.error{color:var(--red);font-size:13px}a{color:var(--ink)}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:200px 1fr}.main{padding:26px}.topbar{padding:18px 26px}.stats{gap:10px}.stat{padding:16px}}@media(max-width:760px){.shell{display:block}.sidebar{padding:20px;gap:18px}.brand{font-size:24px}.sidebar nav{display:flex;overflow-x:auto;gap:5px}.sidebar nav button{white-space:nowrap;padding:10px}.sidebar nav span,.sidebar footer{display:none}.topbar{padding:14px 20px;flex-wrap:wrap}.main{padding:22px 18px}.hero{padding:25px;grid-template-columns:1fr;gap:18px}.count{border-left:0;border-top:1px solid #718477;padding:15px 0 0;display:flex;align-items:baseline;gap:15px}.count strong{font-size:42px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.heading{align-items:flex-start;flex-wrap:wrap}.heading h1{font-size:34px}.stage{grid-template-columns:35px 1fr}.stage>button{grid-column:2}.task{grid-template-columns:44px 1fr;gap:10px}.task>button:last-child{grid-column:2;justify-self:start}.form-row{grid-template-columns:1fr}.identity{flex-wrap:wrap}.section-title{align-items:flex-start}.badge{white-space:normal}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="shell"><aside class="sidebar"><div><div class="brand">TERRAZAS</div><div class="eyebrow">Centro de mando</div></div><nav aria-label="Navegación principal" id="nav"></nav><footer>UN MISMO NORTE<b>Abrimos el 19 nov 2026</b><p>Cada detalle cuenta.<br>Lo construimos en familia.</p></footer></aside><div class="workspace"><header class="topbar"><span class="save" id="saveStatus" role="status">Guardado en este navegador</span><div class="identity"><label for="profile">Mi perfil local</label><select id="profile" aria-label="Mi perfil local"></select><button id="join">+ Registrarme</button><button id="downloadHtml">Descargar HTML</button></div></header><main class="main" id="main"></main></div></div>
<dialog id="modal" aria-labelledby="modalTitle"><div class="row"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="Cerrar ventana">✕</button></div><form id="form"></form></dialog><div class="toast" id="toast" role="status"></div><input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
const KEY='terrazas-centro-v2-local', OPEN='2026-11-19';
const stages=[{id:'s1',name:'Definir y organizar',start:'2026-10-23',end:'2026-10-29',desc:'Asignar responsables, cerrar decisiones y levantar inventarios.'},{id:'s2',name:'Equipar y contratar',start:'2026-10-30',end:'2026-11-05',desc:'Completar compras, incorporar al equipo y preparar los sistemas.'},{id:'s3',name:'Montar y entrenar',start:'2026-11-06',end:'2026-11-12',desc:'Instalar, decorar, capacitar y ensayar el servicio.'},{id:'s4',name:'Probar y afinar',start:'2026-11-13',end:'2026-11-18',desc:'Hacer un servicio de prueba y resolver pendientes críticos.'},{id:'s5',name:'Abrir las puertas',start:OPEN,end:OPEN,desc:'Revisión final, reunión del equipo y primer servicio.'}];
const seeds=[['Cocina y menú','Una propuesta lista para salir a la mesa.','Menú de apertura',['Definir platos y recetas estándar','Calcular costos y precios del menú','Diseñar y aprobar el menú','Imprimir los menús','Probar tiempos de preparación']],['Equipo y servicio','Las personas que harán posible la experiencia.','Equipo de apertura',['Definir cargos, turnos y responsables','Reclutar y entrevistar al personal','Confirmar contrataciones','Completar tallas y compra de uniformes','Capacitar al equipo de cocina y sala']],['Compras e inventario','Todo en su lugar, antes del primer servicio.','Inventario inicial',['Inventariar platos, vasos y cubiertos','Contar utensilios y equipos de cocina','Comprar faltantes de vajilla y cubertería','Definir proveedores e inventario de alimentos']],['Sistemas y administración','Una operación clara desde el primer día.','Puesta en marcha de XETUS',['Confirmar instalación de XETUS','Configurar menú, usuarios y permisos','Probar pedidos, cobros y cierre de caja','Revisar permisos y documentos de operación']],['Reservas y seguridad','Una llegada organizada y una atención cercana.','Recepción de invitados',['Definir canal y política de reservas','Preparar registro y confirmación de reservas','Definir acceso y protocolo de seguridad','Coordinar recepción y atención de invitados']],['Espacio y experiencia','El ambiente que queremos compartir.','Sala lista para recibir',['Definir distribución de mesas y aforo','Asignar numeración y zonas de servicio','Completar decoración e iluminación','Revisar música, baños y señalización']],['Apertura y comunicación','Prepararnos para recibir con confianza.','Cuenta regresiva',['Preparar invitaciones y comunicación','Organizar un servicio de prueba','Resolver hallazgos del servicio de prueba','Verificar limpieza e inventario final','Realizar reunión de equipo y abrir']]];
function initial(){const d={version:2,areas:[],projects:[],tasks:[],people:[],current:''};seeds.forEach((a,i)=>{const area='a'+i,project='p'+i;d.areas.push({id:area,name:a[0],description:a[1]});d.projects.push({id:project,area,name:a[2],description:'',owners:[]});a[3].forEach((name,j)=>{let stage=j<2?'s1':j<4?'s2':'s3';if(i===6)stage=['s2','s4','s4','s5','s5'][j];d.tasks.push({id:'t'+i+'-'+j,project,name,description:'',owners:[],status:'Pendiente',priority:j===0?'Alta':'Media',stage,due:stages.find(s=>s.id===stage).end});});});return d}
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=> 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);

// Actualización aditiva: conserva datos existentes y se aplica una sola vez por copia.
function addCreativeDirection(d){
 if(d.creativeDirectionAdded===true)return false;
 const unique=base=>{const used=new Set([...d.areas,...d.projects,...d.tasks,...d.people].map(x=>x.id));let id=base,n=1;while(used.has(id))id=base+'-'+n++;return id;};
 const lead={id:unique('creative-lead'),name:'Dirección creativa · tú',description:'Liderazgo del área. Edita este perfil con tu nombre; coordina estrategia, equipo y aprobación creativa.'};d.people.push(lead);
 const a={id:unique('creative-area'),name:'Dirección creativa, marketing y redes sociales',description:'Tu área de liderazgo: marca, estrategia, contenido, comunidad y campaña de apertura. Responsables de ejecución por confirmar.'};d.areas.push(a);
 const plans=[
 ['Estrategia de marca y marketing','Definir el norte creativo y comercial antes de producir. Fechas propuestas para la apertura.',[
 ['Definir público, posicionamiento y propuesta de valor','s1','Alta'],['Establecer objetivos de marketing y métricas de apertura','s1','Alta'],['Definir pilares de comunicación y tono de voz','s1','Alta'],['Aprobar canales, presupuesto y prioridades de marketing','s2','Alta']]],
 ['Equipo creativo y organigrama','Propuesta a validar: dirección creativa → gestión de comunidad, diseño y producción audiovisual; coordinación con operaciones para reservas y servicio. No implica contrataciones confirmadas.',[
 ['Diseñar organigrama del equipo creativo y sus roles','s1','Alta'],['Definir alcance, presupuesto y perfil del gestor de comunidad','s1','Alta'],['Finalizar selección y contratación del gestor de comunidad','s2','Alta'],['Asignar responsables de diseño, fotografía y video','s2','Alta'],['Definir quién propone, produce, revisa, aprueba y publica','s2','Alta'],['Acordar reuniones, entregas y tiempos de aprobación','s2','Media']]],
 ['Identidad visual y dirección de arte','Un lenguaje coherente para redes, piezas impresas y experiencia en el restaurante.',[
 ['Auditar y cerrar identidad visual y aplicaciones de marca','s1','Alta'],['Definir referencias visuales y dirección de fotografía','s1','Media'],['Crear plantillas para publicaciones e historias','s2','Media'],['Alinear menús, señalización y decoración con la marca','s3','Media']]],
 ['Redes sociales y comunidad','Instagram ya está listo. La estrategia, operación y atención de la comunidad todavía deben establecerse.',[
 ['Tener lista la cuenta de Instagram','s1','Alta','Completada'],['Definir estrategia y función de Instagram en la apertura','s1','Alta'],['Preparar calendario editorial previo y posterior a la apertura','s2','Alta'],['Definir respuestas, moderación y derivación de reservas','s2','Alta'],['Organizar accesos seguros y entrega al gestor de comunidad','s2','Alta']]],
 ['Producción de contenido','Planificar, producir y aprobar el material necesario para comunicar la experiencia Terrazas.',[
 ['Crear lista de tomas de platos, espacio y equipo','s2','Media'],['Coordinar sesión de fotografía y video','s3','Alta'],['Redactar textos y producir piezas de lanzamiento','s3','Alta'],['Organizar banco de contenido y aprobar piezas finales','s4','Alta']]],
 ['Campaña de apertura y alianzas','Coordinar con Apertura y comunicación: este proyecto desarrolla el mensaje y la difusión; operaciones confirma capacidad y logística.',[
 ['Diseñar campaña de expectativa y anuncio de apertura','s2','Alta'],['Definir alianzas, invitados y posibles creadores de contenido','s2','Media'],['Preparar comunicación de reservas con el equipo operativo','s3','Alta'],['Aprobar y programar publicaciones de apertura','s4','Alta'],['Coordinar cobertura del primer servicio','s5','Alta']]],
 ['Medición y mejora continua','Establecer cómo evaluar resultados y convertir las primeras respuestas en mejoras.',[
 ['Crear tablero de alcance, interacción, consultas y reservas','s3','Media'],['Verificar recorrido desde Instagram hasta la reserva','s4','Alta'],['Agendar revisión de resultados después de la apertura','s5','Media']]]
 ];
 plans.forEach(([name,description,tasks],i)=>{const pr={id:unique('creative-project-'+i),area:a.id,name,description,owners:[lead.id]};d.projects.push(pr);tasks.forEach(([name,stage,priority,status],j)=>d.tasks.push({id:unique('creative-task-'+i+'-'+j),project:pr.id,name,description:status==='Completada'?'Confirmado: Instagram ya está listo.':'Responsabilidad inicial de coordinación: dirección creativa. Confirmar quién ejecuta y añadir responsables según el organigrama. Fecha propuesta; ajustar al plan real.',owners:[lead.id],status:status||'Pendiente',priority,stage,due:stages.find(x=>x.id===stage).end}));});
 d.creativeDirectionAdded=true;return true;
}

let data=initial(),page='overview',areaFilter='',projectFilter='',statusFilter='',stageFilter='',query='',storageOK=true;
function valid(d){if(!d||d.version!==2||!['areas','projects','tasks','people'].every(k=>Array.isArray(d[k])&&d[k].length<10000))return false;const ids=new Set();for(const k of ['areas','projects','tasks','people'])for(const x of d[k]){if(!x||typeof x.id!=='string'||!x.id||ids.has(x.id)||typeof x.name!=='string'||!x.name.trim()||x.name.length>200)return false;ids.add(x.id);if(x.description!==undefined&&typeof x.description!=='string')return false;}const people=new Set(d.people.map(x=>x.id)),areas=new Set(d.areas.map(x=>x.id)),projects=new Set(d.projects.map(x=>x.id));for(const x of [...d.projects,...d.tasks])if(!Array.isArray(x.owners)||!x.owners.every(id=>people.has(id)))return false;return d.projects.every(p=>areas.has(p.area))&&d.tasks.every(t=>projects.has(t.project)&&['Pendiente','En curso','Bloqueada','Completada'].includes(t.status)&&['Alta','Media','Baja'].includes(t.priority)&&stages.some(s=>s.id===t.stage)&&typeof t.due==='string'&&(!t.due||(/^\d{4}-\d{2}-\d{2}$/.test(t.due)&&!isNaN(Date.parse(t.due)))))&&typeof d.current==='string'&&(!d.current||people.has(d.current));}
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!valid(parsed))throw Error('invalid');data=parsed;}}catch(e){storageOK=false;}
const creativeUpdated=addCreativeDirection(data);
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;$('#saveStatus').textContent='Guardado local · '+new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});}catch(e){storageOK=false;$('#saveStatus').textContent='No se pudo guardar · exporta un respaldo';toast('No se pudo guardar. Exporta un respaldo antes de cerrar.');}}
function toast(s){$('#toast').textContent=s;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').textContent='',4500)}
const date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es',{day:'numeric',month:'short'}):'Sin fecha';
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Caracas',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const overdue=t=>t.due&&t.due<today()&&t.status!=='Completada';
const project=id=>data.projects.find(p=>p.id===id),area=id=>data.areas.find(a=>a.id===id),person=id=>data.people.find(p=>p.id===id),percent=ts=>ts.length?Math.round(ts.filter(t=>t.status==='Completada').length/ts.length*100):0;
const names=ids=>ids.map(id=>person(id)?.name).filter(Boolean).join(', ')||'Sin responsables';
const bar=ts=>`<div class="progress" role="progressbar" aria-label="Avance" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent(ts)}"><i style="width:${percent(ts)}%"></i></div>`;
function go(p){page=p;areaFilter=projectFilter=statusFilter=stageFilter=query='';render();}
function render(){const nav=[['overview','01','Vista general'],['areas','02','Áreas y proyectos'],['tasks','03','Todas las tareas'],['personal','04','Mi panel'],['stages','05','Etapas de apertura'],['team','06','Familia y equipo'],['backup','07','Respaldos y ayuda']];$('#nav').innerHTML=nav.map(([id,n,title])=>`<button data-nav="${id}" ${page===id?'aria-current="page"':''}><span>${n}</span>${title}</button>`).join('');$('#profile').innerHTML='<option value="">Seleccionar perfil</option>'+data.people.map(p=>`<option value="${esc(p.id)}" ${p.id===data.current?'selected':''}>${esc(p.name)}</option>`).join('');if(!storageOK)$('#saveStatus').textContent='Guardado no disponible · revisa respaldos';const main=$('#main');if(page==='overview')main.innerHTML=overview();if(page==='areas')main.innerHTML=areasView();if(page==='tasks'||page==='personal')main.innerHTML=tasksView();if(page==='stages')main.innerHTML=stagesView();if(page==='team')main.innerHTML=teamView();if(page==='backup')main.innerHTML=backupView();}
function heading(title,sub,action=''){return `<div class="heading"><div><div class="eyebrow muted">Plan de apertura / 2026</div><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`}
function overview(){const ts=data.tasks,done=ts.filter(t=>t.status==='Completada').length,days=Math.ceil((Date.parse(OPEN+'T00:00:00-04:00')-Date.parse(today()+'T00:00:00-04:00'))/86400000);return `<div class="hero"><div><div class="eyebrow">El siguiente capítulo comienza aquí</div><h1>Todo listo para recibir.</h1><p>Un espacio para organizar los detalles, compartir responsabilidades y construir juntos la apertura de Terrazas.</p></div><div class="count"><strong>${Math.max(0,days)}</strong><span>${days>=0?'días para abrir':'Apertura programada'}<br>19 de noviembre de 2026</span></div></div><div class="stats"><div class="stat"><span>AVANCE GENERAL</span><strong>${percent(ts)}%</strong>${bar(ts)}</div><div class="stat"><span>TAREAS COMPLETADAS</span><strong>${done} <small>/ ${ts.length}</small></strong></div><div class="stat"><span>REQUIEREN ATENCIÓN</span><strong>${ts.filter(t=>overdue(t)||t.status==='Bloqueada').length}</strong><span>Vencidas o bloqueadas</span></div><div class="stat"><span>POR ASIGNAR</span><strong>${ts.filter(t=>!t.owners.length&&t.status!=='Completada').length}</strong><span>Tareas sin responsables</span></div></div><div class="row section-title"><h2>Los frentes de nuestra apertura</h2><button data-nav="areas">Ver áreas →</button></div><div class="grid">${data.areas.map(areaCard).join('')}</div><div class="row section-title"><h2>El próximo paso</h2><button data-new="task" class="primary">+ Nueva tarea</button></div>${ts.filter(t=>t.status!=='Completada').sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,4).map(taskRow).join('')||'<div class="empty">Todas las tareas están completas.</div>'}${localNotice()}`}
function localNotice(){return '<div class="notice"><b>Esta es tu copia local.</b> Los cambios se guardan solo en este navegador y dispositivo. GitHub Pages publica la página, pero no comparte el avance. <b>Para sincronizar entre familiares hace falta un backend y una base de datos compartida.</b> Los perfiles no son cuentas con acceso privado.</div>'}
function areaCard(a){const ps=data.projects.filter(p=>p.area===a.id),ts=data.tasks.filter(t=>ps.some(p=>p.id===t.project));return `<article class="card"><div class="row"><span class="eyebrow muted">${ps.length} proyecto${ps.length===1?'':'s'}</span><span class="badge">${percent(ts)}%</span></div><h3>${esc(a.name)}</h3><p>${esc(a.description)}</p><div class="bottom">${bar(ts)}<div class="row"><small>${ts.filter(t=>t.status==='Completada').length} de ${ts.length} tareas</small><button data-area="${esc(a.id)}">Explorar →</button></div></div></article>`}
function areasView(){if(!areaFilter)return heading('Áreas y proyectos','Cada frente tiene su espacio. Entra para organizar sus proyectos.','<button class="primary" data-new="area">+ Nueva área</button>')+`<div class="grid">${data.areas.map(areaCard).join('')}</div>`;const a=area(areaFilter);return heading(esc(a.name),esc(a.description),'<button data-new="project" class="primary">+ Nuevo proyecto</button>')+`<div class="actions"><button data-back-areas>← Todas las áreas</button><button data-edit-area="${esc(a.id)}">Editar área</button><button class="danger" data-delete-area="${esc(a.id)}">Eliminar área vacía</button></div><div class="grid section-title">${data.projects.filter(p=>p.area===a.id).map(p=>{const ts=data.tasks.filter(t=>t.project===p.id);return `<article class="card"><h3>${esc(p.name)}</h3><p>${esc(p.description||'Organiza las tareas de este proyecto.')}</p><small>Responsables: ${esc(names(p.owners))}</small>${bar(ts)}<small>${percent(ts)}% · ${ts.length} tareas</small><div class="actions"><button data-project="${esc(p.id)}">Ver tareas</button><button data-edit-project="${esc(p.id)}">Editar</button><button data-claim-project="${esc(p.id)}">Sumarme</button></div></article>`}).join('')||'<div class="empty">Crea el primer proyecto de esta área.</div>'}</div>`}
function options(items,value,all){return (all?`<option value="">${all}</option>`:'')+items.map(x=>`<option value="${esc(x.id)}" ${x.id===value?'selected':''}>${esc(x.name)}</option>`).join('')}
function filtered(){return data.tasks.filter(t=>(page!=='personal'||(data.current&&t.owners.includes(data.current)))&&(!projectFilter||t.project===projectFilter)&&(!areaFilter||project(t.project)?.area===areaFilter)&&(!statusFilter||t.status===statusFilter)&&(!stageFilter||t.stage===stageFilter)&&(!query||[t.name,t.description,names(t.owners)].join(' ').toLocaleLowerCase('es').includes(query.toLocaleLowerCase('es')))).sort((a,b)=>(a.status==='Completada')-(b.status==='Completada')||(a.due||'9999').localeCompare(b.due||'9999'))}
function tasksView(){const personal=page==='personal';return heading(personal?'Tu parte de Terrazas':'Todas las tareas',personal?(data.current?'Hola, '+esc(person(data.current).name)+'. Estas son las tareas en las que participas.':'Selecciona o registra tu perfil para ver tus tareas.'):'De la idea al detalle resuelto. Un paso a la vez.','<button class="primary" data-new="task">+ Nueva tarea</button>')+(personal?'<div class="notice">Las tareas aparecen aquí cuando estás asignado directamente. Ser responsable de un proyecto no asigna automáticamente todas sus tareas.</div><br>':'')+`<div class="filters"><label class="search">Buscar<input id="search" type="search" value="${esc(query)}" placeholder="Tarea, nota o responsable…"></label><label>Área<select id="filterArea">${options(data.areas,areaFilter,'Todas las áreas')}</select></label><label>Proyecto<select id="filterProject">${options(data.projects.filter(p=>!areaFilter||p.area===areaFilter),projectFilter,'Todos los proyectos')}</select></label><label>Estado<select id="filterStatus">${options(['Pendiente','En curso','Bloqueada','Completada'].map(x=>({id:x,name:x})),statusFilter,'Todos los estados')}</select></label><label>Etapa<select id="filterStage">${options(stages,stageFilter,'Todas las etapas')}</select></label><button data-clear>Limpiar filtros</button></div><div id="taskList">${taskList()}</div>`}
function taskList(){const ts=filtered();return `<p class="muted">${ts.length} tareas · ${percent(ts)}% completado</p>`+ts.map(taskRow).join('')+(ts.length?'':'<div class="empty">No hay tareas en esta vista. Puedes ajustar los filtros o asignarte una tarea desde «Todas las tareas».</div>')}
function taskRow(t){return `<article class="task ${t.status==='Completada'?'done':''}"><button class="tick" data-toggle="${esc(t.id)}" aria-label="${t.status==='Completada'?'Reabrir':'Completar'}: ${esc(t.name)}">${t.status==='Completada'?'✓':'○'}</button><div><h3>${esc(t.name)}</h3><div class="meta"><span>${esc(project(t.project)?.name)}</span><span>·</span><span class="badge ${t.status==='Bloqueada'?'red':''}">${t.status}</span><span>Prioridad ${t.priority.toLowerCase()}</span><span class="${overdue(t)?'badge red':''}">${overdue(t)?'Vencida · ':''}${date(t.due)}</span></div><div class="meta" style="margin-top:8px">Responsables: ${esc(names(t.owners))}</div></div><button data-edit-task="${esc(t.id)}">Abrir tarea</button></article>`}
function stagesView(){return heading('El camino a la apertura','Calendario propuesto y editable por tarea · Meta: 19 de noviembre de 2026.')+`<div class="timeline">${stages.map((s,i)=>{const ts=data.tasks.filter(t=>t.stage===s.id);return `<article class="card stage"><div class="number">0${i+1}</div><div><div class="eyebrow muted">${date(s.start)} — ${date(s.end)}</div><h3>${s.name}</h3><p>${s.desc}</p>${bar(ts)}<small>${ts.filter(t=>t.status==='Completada').length}/${ts.length} tareas completas · ${percent(ts)}%</small></div><button data-stage="${s.id}">Ver tareas →</button></article>`}).join('')}</div><div class="notice">Las etapas son una guía inicial. Puedes cambiar la etapa y la fecha límite de cada tarea al abrirla. El avance refleja tareas completadas, no garantiza la preparación real de la apertura.</div>`}
function teamView(){return heading('Familia y equipo','Registra perfiles locales y comparte responsabilidades.','<button class="primary" data-new="person">+ Añadir persona</button>')+`<div class="grid">${data.people.map(p=>{const ts=data.tasks.filter(t=>t.owners.includes(p.id));return `<article class="card"><div class="person"><span class="avatar">${esc(p.name.slice(0,2).toUpperCase())}</span><h3>${esc(p.name)}</h3></div><p>${esc(p.description||'Equipo Terrazas')}</p><small>${ts.length} tareas asignadas · ${percent(ts)}% completo</small>${bar(ts)}<div class="actions"><button data-use-person="${esc(p.id)}">Ver su panel</button><button data-edit-person="${esc(p.id)}">Editar</button></div></article>`}).join('')||'<div class="empty">Añade a la primera persona del equipo para empezar a asignar tareas.</div>'}</div>${localNotice()}`}
function backupView(){return heading('Tu avance, a buen resguardo','Un archivo, sin instalaciones. Conserva una copia de tus datos.')+`<div class="card help page-note"><h2>Respaldos de esta copia</h2><p>Exporta antes de cambiar de equipo, mover el archivo o borrar los datos del navegador. El respaldo incluye áreas, proyectos, tareas, responsables y perfiles.</p><div class="actions"><button id="export" class="primary">Exportar respaldo JSON</button><button id="import">Importar respaldo JSON</button></div><p>Importar <b>reemplaza</b> esta copia; no combina los cambios de varias personas. Guarda un respaldo previo.</p><h3>Abrir en tu computadora</h3><p>Haz doble clic en <b>index.html</b>. Todo el diseño y la aplicación están dentro del archivo. No requiere internet ni recursos externos. El navegador conserva los cambios mediante almacenamiento local; el propio HTML no se modifica.</p><h3>Publicar en GitHub Pages</h3><p>Sube este index.html a la raíz del repositorio. En su configuración, entra a Pages, elige publicar desde la rama principal y la carpeta raíz. Comparte la dirección que GitHub te indique.</p><h3>Qué sucede al compartirlo</h3><p>Cada navegador comienza con el plan inicial y guarda su propio avance. Tus datos locales no se incluyen al subir el HTML. Para llevarlos a otra copia, exporta e importa el respaldo.</p><p><b>Para sincronizar entre familiares hace falta un backend y una base de datos compartida.</b> Esta versión no tiene sincronización, inicio de sesión, permisos privados ni colaboración en tiempo real. Los perfiles solo organizan responsables dentro de esta copia.</p><h3>Si el navegador impide guardar</h3><p>Algunos navegadores restringen el almacenamiento de archivos abiertos con doble clic o en modo privado. Si aparece el aviso de error, exporta antes de cerrar. Cambiar de ruta, navegador o dirección web puede abrir una copia distinta.</p></div>`}
const modal=$('#modal');$('#closeModal').onclick=()=>modal.close();let editing=null;
function field(name,label,value='',type='text',required=true){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='text'?'maxlength="200"':''}></label>`}
function ownerFields(ids){return `<fieldset><legend>Responsables · puedes elegir varios</legend><div class="checks">${data.people.map(p=>`<label><input type="checkbox" name="owners" value="${esc(p.id)}" ${ids.includes(p.id)?'checked':''}>${esc(p.name)}</label>`).join('')||'<small>Primero registra personas en «Familia y equipo».</small>'}</div></fieldset>`}
function openEditor(kind,id){const list={task:'tasks',project:'projects',area:'areas',person:'people'}[kind],obj=data[list].find(x=>x.id===id);editing={kind,list,id};if(kind==='task'&&!data.projects.length){toast('Crea primero un área y un proyecto.');return}if(kind==='project'&&!data.areas.length){toast('Crea primero un área.');return}$('#modalTitle').textContent=(obj?'Editar ':'Crear ')+{task:'tarea',project:'proyecto',area:'área',person:'perfil'}[kind];let content=field('name',kind==='person'?'Nombre de la persona':'Nombre',obj?.name||'');if(kind==='task')content+=`<label>Proyecto<select name="project" required>${options(data.projects,obj?.project||projectFilter||data.projects.find(p=>p.area===areaFilter)?.id)}</select></label><div class="form-row"><label>Estado<select name="status">${options(['Pendiente','En curso','Bloqueada','Completada'].map(x=>({id:x,name:x})),obj?.status||'Pendiente')}</select></label><label>Prioridad<select name="priority">${options(['Alta','Media','Baja'].map(x=>({id:x,name:x})),obj?.priority||'Media')}</select></label></div><div class="form-row">${field('due','Fecha límite',obj?.due??OPEN,'date',false)}<label>Etapa<select name="stage">${options(stages,obj?.stage||stageFilter||'s1')}</select></label></div>`;if(kind==='project')content+=`<label>Área<select name="area" required>${options(data.areas,obj?.area||areaFilter)}</select></label>`;content+=`<label>${kind==='person'?'Rol o colaboración':'Notas y detalles'}<textarea name="description" maxlength="5000">${esc(obj?.description||'')}</textarea></label>`;if(kind==='task'||kind==='project')content+=ownerFields(obj?.owners||[])+(data.current?'<button type="button" id="assignMe">Añadirme como responsable</button>':'');content+=`<p id="formError" class="error" role="alert"></p><div class="actions"><button type="submit" class="primary">Guardar ${kind==='person'?'perfil':kind==='task'?'tarea':kind==='area'?'área':'proyecto'}</button><button type="button" id="cancel">Cancelar</button>${obj?'<button type="button" id="delete" class="danger">Eliminar</button>':''}</div>`;$('#form').innerHTML=content;$('#cancel').onclick=()=>modal.close();if($('#assignMe'))$('#assignMe').onclick=()=>{[...$('#form').querySelectorAll('[name=owners]')].find(x=>x.value===data.current).checked=true;};if($('#delete'))$('#delete').onclick=deleteEditing;modal.showModal();}
$('#form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim();if(!name){$('#formError').textContent='Escribe un nombre.';return}if(editing.kind==='person'&&data.people.some(p=>p.id!==editing.id&&p.name.toLowerCase()===name.toLowerCase())){$('#formError').textContent='Ya existe una persona con ese nombre.';return}const obj={id:editing.id||uid(),name,description:f.get('description').trim()};for(const k of ['project','status','priority','stage','due','area'])if(f.has(k))obj[k]=f.get(k);if(['task','project'].includes(editing.kind))obj.owners=f.getAll('owners');const idx=data[editing.list].findIndex(x=>x.id===editing.id);if(idx>=0)data[editing.list][idx]=obj;else data[editing.list].push(obj);if(editing.kind==='person'&&!data.current)data.current=obj.id;save();modal.close();render();toast('Cambios guardados en esta copia.');};
function deleteEditing(){const {kind,id,list}=editing;if(kind==='area'&&data.projects.some(p=>p.area===id)){$('#formError').textContent='Mueve o elimina los proyectos antes de eliminar el área.';return}if(kind==='project'&&data.tasks.some(t=>t.project===id)){$('#formError').textContent='Mueve o elimina las tareas antes de eliminar el proyecto.';return}if(!confirm('¿Eliminar este registro?'+(kind==='person'?' Se quitará de todos los responsables.':'')))return;data[list]=data[list].filter(x=>x.id!==id);if(kind==='person'){for(const x of [...data.tasks,...data.projects])x.owners=x.owners.filter(p=>p!==id);if(data.current===id)data.current=''}if(kind==='area')areaFilter='';save();modal.close();render();toast('Registro eliminado.');}
$('#profile').onchange=e=>{data.current=e.target.value;save();render()};$('#join').onclick=()=>openEditor('person');
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.nav)go(d.nav);if(d.new)openEditor(d.new);for(const kind of ['Task','Project','Area','Person'])if(d['edit'+kind])openEditor(kind.toLowerCase(),d['edit'+kind]);if(d.area){areaFilter=d.area;page='areas';render()}if(d.project){projectFilter=d.project;page='tasks';render()}if(d.stage){go('tasks');stageFilter=d.stage;render()}if('backAreas'in d){areaFilter='';render()}if('clear'in d){areaFilter=projectFilter=statusFilter=stageFilter=query='';render()}if(d.toggle){const t=data.tasks.find(t=>t.id===d.toggle);t.status=t.status==='Completada'?'Pendiente':'Completada';save();render()}if(d.usePerson){data.current=d.usePerson;save();go('personal')}if(d.claimProject){if(!data.current){toast('Selecciona o registra primero tu perfil.');return}const p=project(d.claimProject);if(!p.owners.includes(data.current))p.owners.push(data.current);save();render();toast('Ahora eres responsable de este proyecto.')}if(d.deleteArea){editing={kind:'area',list:'areas',id:d.deleteArea};if(data.projects.some(p=>p.area===d.deleteArea)){toast('El área contiene proyectos. Muévelos o elimínalos primero.');return}deleteEditing()}if(b.id==='downloadHtml')downloadHTML();if(b.id==='export')exportData();if(b.id==='import')$('#importFile').click();});
document.addEventListener('change',e=>{if(e.target.id==='filterArea'){areaFilter=e.target.value;projectFilter='';render()}if(e.target.id==='filterProject'){projectFilter=e.target.value;render()}if(e.target.id==='filterStatus'){statusFilter=e.target.value;render()}if(e.target.id==='filterStage'){stageFilter=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#taskList').innerHTML=taskList()}});
function downloadHTML(){const copy=document.documentElement.cloneNode(true);copy.querySelector('#modal').removeAttribute('open');copy.querySelector('#form').innerHTML='';copy.querySelector('#main').innerHTML='';copy.querySelector('#profile').innerHTML='';copy.querySelector('#toast').textContent='';const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('HTML preparado. Para llevar tu avance, exporta también un respaldo JSON.');}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='terrazas-respaldo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Respaldo preparado para descargar.');}
$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error('size');const incoming=JSON.parse(await file.text());if(!valid(incoming))throw Error('schema');if(!confirm(`Este respaldo tiene ${incoming.tasks.length} tareas y ${incoming.people.length} personas. Reemplazará todos los datos de esta copia. ¿Continuar?`))return;data=incoming;addCreativeDirection(data);save();go('overview');toast('Respaldo importado.');}catch(err){toast('No se importó: el archivo no es un respaldo válido de Terrazas (máximo 5 MB).');}finally{e.target.value=''}};
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const d=JSON.parse(e.newValue);if(valid(d)){if(modal.open){toast('Cambios en otra pestaña. Cierra este formulario y recarga antes de editar.');return}data=d;render();}}catch{}}});
render();
if(creativeUpdated&&storageOK)save();
</script></body></html>
